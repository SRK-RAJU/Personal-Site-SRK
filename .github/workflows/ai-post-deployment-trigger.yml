name: Trigger AI Post Generation

on:
  push:
    branches:
      - develop
      - master
      - main
  workflow_dispatch:

jobs:
  trigger-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Call deployment-check endpoint
        env:
          TARGET_URL: ${{ vars.AI_POST_TRIGGER_URL || 'https://personal-site-srk-git-develop-rajukumars-projects-f8a86150.vercel.app/api/ai-agent/check-deployment' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent --location \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-trigger-source: github-actions" \
            -H "x-github-event: push" \
            -H "User-Agent: GitHub-Actions-Workflow/1.0" \
            "$TARGET_URL"
