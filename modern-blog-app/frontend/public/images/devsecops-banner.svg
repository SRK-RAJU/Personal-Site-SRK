<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="securityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Security Accent Border -->
  <rect width="1200" height="400" fill="none" stroke="url(#securityGradient)" stroke-width="5" rx="10"/>

  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="30" fill="#06b6d4" opacity="0.1"/>
  <circle cx="1150" cy="350" r="40" fill="#ec4899" opacity="0.1"/>
  
  <!-- Main Title -->
  <g id="mainTitle" filter="url(#glow)">
    <text x="600" y="70" font-size="68" font-weight="900" text-anchor="middle" fill="url(#titleGradient)" font-family="'Segoe UI', Arial, sans-serif" letter-spacing="2">
      DevSecOps
    </text>
  </g>

  <!-- Subtitle with emphasis on Security -->
  <g id="subtitle">
    <text x="600" y="110" font-size="20" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" letter-spacing="2" font-weight="600">
      SECURE • DEVELOPMENT • OPERATIONS
    </text>
    <text x="600" y="140" font-size="14" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif">
      Security Integrated Throughout Your Pipeline
    </text>
  </g>

  <!-- Pipeline with Security Focus -->
  <g id="pipeline">
    <!-- Vertical dividers -->
    <line x1="100" y1="180" x2="100" y2="380" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="300" y1="180" x2="300" y2="380" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="500" y1="180" x2="500" y2="380" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="700" y1="180" x2="700" y2="380" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="900" y1="180" x2="900" y2="380" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="1100" y1="180" x2="1100" y2="380" stroke="#334155" stroke-width="1" opacity="0.3"/>

    <!-- Pipeline connectors -->
    <line x1="100" y1="240" x2="300" y2="240" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="300" y1="240" x2="500" y2="240" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="500" y1="240" x2="700" y2="240" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="700" y1="240" x2="900" y2="240" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="900" y1="240" x2="1100" y2="240" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Arrow heads on connectors -->
    <polygon points="300,240 290,235 290,245" fill="#06b6d4" opacity="0.6"/>
    <polygon points="500,240 490,235 490,245" fill="#06b6d4" opacity="0.6"/>
    <polygon points="700,240 690,235 690,245" fill="#ef4444" opacity="0.8"/>
    <polygon points="900,240 890,235 890,245" fill="#06b6d4" opacity="0.6"/>
    <polygon points="1100,240 1090,235 1090,245" fill="#06b6d4" opacity="0.6"/>

    <!-- Step 1: PLAN -->
    <g filter="url(#dropShadow)">
      <rect x="60" y="210" width="80" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
      <text x="100" y="230" font-size="24" text-anchor="middle" fill="#06b6d4">📋</text>
      <text x="100" y="256" font-size="12" text-anchor="middle" fill="#cbd5e1" font-weight="600">PLAN</text>
    </g>

    <!-- Step 2: DESIGN -->
    <g filter="url(#dropShadow)">
      <rect x="260" y="210" width="80" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
      <text x="300" y="230" font-size="24" text-anchor="middle" fill="#06b6d4">🎨</text>
      <text x="300" y="256" font-size="12" text-anchor="middle" fill="#cbd5e1" font-weight="600">DESIGN</text>
    </g>

    <!-- Step 3: SCAN (Security) - HIGHLIGHTED -->
    <g filter="url(#glow)">
      <rect x="460" y="200" width="80" height="80" rx="8" fill="#1e293b" stroke="url(#securityGradient)" stroke-width="3" opacity="1"/>
      <text x="500" y="225" font-size="28" text-anchor="middle" fill="#ef4444">🔍</text>
      <text x="500" y="256" font-size="12" text-anchor="middle" fill="#fca5a5" font-weight="700">SCAN</text>
      <text x="500" y="270" font-size="10" text-anchor="middle" fill="#fecaca">Security</text>
    </g>

    <!-- Step 4: BUILD -->
    <g filter="url(#dropShadow)">
      <rect x="660" y="210" width="80" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
      <text x="700" y="230" font-size="24" text-anchor="middle" fill="#06b6d4">🔨</text>
      <text x="700" y="256" font-size="12" text-anchor="middle" fill="#cbd5e1" font-weight="600">BUILD</text>
    </g>

    <!-- Step 5: TEST -->
    <g filter="url(#dropShadow)">
      <rect x="860" y="210" width="80" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
      <text x="900" y="230" font-size="24" text-anchor="middle" fill="#06b6d4">✅</text>
      <text x="900" y="256" font-size="12" text-anchor="middle" fill="#cbd5e1" font-weight="600">TEST</text>
    </g>

    <!-- Step 6: DEPLOY -->
    <g filter="url(#dropShadow)">
      <rect x="1060" y="210" width="80" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
      <text x="1100" y="230" font-size="24" text-anchor="middle" fill="#06b6d4">🚀</text>
      <text x="1100" y="256" font-size="12" text-anchor="middle" fill="#cbd5e1" font-weight="600">DEPLOY</text>
    </g>
  </g>

  <!-- Security badge -->
  <g id="securityBadge" filter="url(#glow)">
    <circle cx="1100" cy="60" r="35" fill="none" stroke="url(#securityGradient)" stroke-width="3"/>
    <text x="1100" y="55" font-size="28" text-anchor="middle" fill="#ef4444">🔒</text>
    <text x="1100" y="75" font-size="10" text-anchor="middle" fill="#fca5a5" font-weight="700">SECURE</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="395" width="1200" height="5" fill="url(#titleGradient)"/>
</svg>
