<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f141e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="50" font-size="42" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)" font-family="Arial, sans-serif">
    MY COMPLETE TECH STACK
  </text>

  <!-- Subtitle -->
  <text x="500" y="85" font-size="16" text-anchor="middle" fill="#a8dadc" font-family="Arial, sans-serif">
    Cloud • DevOps • Security • Full-Stack Development
  </text>

  <!-- Divider Line -->
  <line x1="100" y1="100" x2="900" y2="100" stroke="#00d4ff" stroke-width="2"/>

  <!-- CLOUD SECTION -->
  <text x="150" y="160" font-size="20" font-weight="bold" fill="#87CEEB" font-family="Arial, sans-serif">☁️ CLOUD</text>
  <g id="cloud-tools">
    <!-- AWS -->
    <rect x="80" y="180" width="140" height="120" rx="8" fill="rgba(255,153,0,0.1)" stroke="#FF9900" stroke-width="2"/>
    <text x="150" y="210" font-size="28" text-anchor="middle">🟠</text>
    <text x="150" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">AWS</text>
    <text x="150" y="280" font-size="10" text-anchor="middle" fill="#b0b0b0">EC2, S3, Lambda</text>

    <!-- Azure -->
    <rect x="250" y="180" width="140" height="120" rx="8" fill="rgba(0,120,215,0.1)" stroke="#0078D4" stroke-width="2"/>
    <text x="320" y="210" font-size="28" text-anchor="middle">🔵</text>
    <text x="320" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Azure</text>
    <text x="320" y="280" font-size="10" text-anchor="middle" fill="#b0b0b0">VMs, App Service</text>

    <!-- GCP -->
    <rect x="420" y="180" width="140" height="120" rx="8" fill="rgba(66,133,244,0.1)" stroke="#4285F4" stroke-width="2"/>
    <text x="490" y="210" font-size="28" text-anchor="middle">🟣</text>
    <text x="490" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">GCP</text>
    <text x="490" y="280" font-size="10" text-anchor="middle" fill="#b0b0b0">Compute, BigQuery</text>

    <!-- Supabase -->
    <rect x="590" y="180" width="140" height="120" rx="8" fill="rgba(32,178,170,0.1)" stroke="#20B2AA" stroke-width="2"/>
    <text x="660" y="210" font-size="28" text-anchor="middle">🟢</text>
    <text x="660" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Supabase</text>
    <text x="660" y="280" font-size="10" text-anchor="middle" fill="#b0b0b0">PostgreSQL, Auth</text>
  </g>

  <!-- DEVOPS SECTION -->
  <text x="150" y="350" font-size="20" font-weight="bold" fill="#FF8C42" font-family="Arial, sans-serif">⚙️ DEVOPS</text>
  <g id="devops-tools">
    <!-- Docker -->
    <rect x="80" y="370" width="140" height="120" rx="8" fill="rgba(23,114,175,0.1)" stroke="#2496ED" stroke-width="2"/>
    <text x="150" y="400" font-size="28" text-anchor="middle">🐳</text>
    <text x="150" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Docker</text>
    <text x="150" y="470" font-size="10" text-anchor="middle" fill="#b0b0b0">Containerization</text>

    <!-- Kubernetes -->
    <rect x="250" y="370" width="140" height="120" rx="8" fill="rgba(50,100,200,0.1)" stroke="#326CE5" stroke-width="2"/>
    <text x="320" y="400" font-size="28" text-anchor="middle">☸️</text>
    <text x="320" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Kubernetes</text>
    <text x="320" y="470" font-size="10" text-anchor="middle" fill="#b0b0b0">Orchestration</text>

    <!-- Terraform -->
    <rect x="420" y="370" width="140" height="120" rx="8" fill="rgba(216,100,0,0.1)" stroke="#623CE4" stroke-width="2"/>
    <text x="490" y="400" font-size="28" text-anchor="middle">📦</text>
    <text x="490" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Terraform</text>
    <text x="490" y="470" font-size="10" text-anchor="middle" fill="#b0b0b0">Infrastructure Code</text>

    <!-- CI/CD -->
    <rect x="590" y="370" width="140" height="120" rx="8" fill="rgba(255,107,107,0.1)" stroke="#FF6B6B" stroke-width="2"/>
    <text x="660" y="400" font-size="28" text-anchor="middle">🚀</text>
    <text x="660" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#e0e0e0">GitLab CI/CD</text>
    <text x="660" y="470" font-size="10" text-anchor="middle" fill="#b0b0b0">Automation</text>
  </g>

  <!-- SECURITY SECTION -->
  <text x="150" y="540" font-size="20" font-weight="bold" fill="#ff006e" font-family="Arial, sans-serif">🔒 SECURITY</text>
  <g id="security-tools">
    <!-- SAST/DAST -->
    <rect x="80" y="560" width="140" height="120" rx="8" fill="rgba(255,0,110,0.1)" stroke="#FF006E" stroke-width="2"/>
    <text x="150" y="590" font-size="24" text-anchor="middle">🔍</text>
    <text x="150" y="620" font-size="11" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Code Scanning</text>
    <text x="150" y="655" font-size="9" text-anchor="middle" fill="#b0b0b0">SonarQube, Snyk</text>

    <!-- IAM & Access -->
    <rect x="250" y="560" width="140" height="120" rx="8" fill="rgba(255,0,110,0.1)" stroke="#FF006E" stroke-width="2"/>
    <text x="320" y="590" font-size="24" text-anchor="middle">🔐</text>
    <text x="320" y="620" font-size="11" font-weight="bold" text-anchor="middle" fill="#e0e0e0">IAM & Access</text>
    <text x="320" y="655" font-size="9" text-anchor="middle" fill="#b0b0b0">Azure AD, AWS IAM</text>

    <!-- Monitoring -->
    <rect x="420" y="560" width="140" height="120" rx="8" fill="rgba(255,0,110,0.1)" stroke="#FF006E" stroke-width="2"/>
    <text x="490" y="590" font-size="24" text-anchor="middle">📊</text>
    <text x="490" y="620" font-size="11" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Monitoring</text>
    <text x="490" y="655" font-size="9" text-anchor="middle" fill="#b0b0b0">Datadog, Prometheus</text>

    <!-- Compliance -->
    <rect x="590" y="560" width="140" height="120" rx="8" fill="rgba(255,0,110,0.1)" stroke="#FF006E" stroke-width="2"/>
    <text x="660" y="590" font-size="24" text-anchor="middle">✅</text>
    <text x="660" y="620" font-size="11" font-weight="bold" text-anchor="middle" fill="#e0e0e0">Compliance</text>
    <text x="660" y="655" font-size="9" text-anchor="middle" fill="#b0b0b0">SIEM, Audit Logs</text>
  </g>

  <!-- DEVELOPMENT SECTION (Top Right) -->
  <text x="750" y="160" font-size="20" font-weight="bold" fill="#00d4ff" font-family="Arial, sans-serif">💻 DEVELOPMENT</text>
  <g id="dev-tools">
    <!-- Frontend -->
    <rect x="780" y="180" width="180" height="100" rx="8" fill="rgba(0,212,255,0.1)" stroke="#00D4FF" stroke-width="2"/>
    <text x="870" y="215" font-size="11" font-weight="bold" fill="#e0e0e0" text-anchor="middle">React • Next.js</text>
    <text x="870" y="235" font-size="11" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Tailwind • TypeScript</text>
    <text x="870" y="260" font-size="9" fill="#b0b0b0" text-anchor="middle">Framer Motion • REST APIs</text>

    <!-- Backend -->
    <rect x="780" y="300" width="180" height="100" rx="8" fill="rgba(0,212,255,0.1)" stroke="#00D4FF" stroke-width="2"/>
    <text x="870" y="335" font-size="11" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Node.js • Express</text>
    <text x="870" y="355" font-size="11" font-weight="bold" fill="#e0e0e0" text-anchor="middle">PostgreSQL • MongoDB</text>
    <text x="870" y="380" font-size="9" fill="#b0b0b0" text-anchor="middle">GraphQL • WebSockets</text>

    <!-- Full-Stack -->
    <rect x="780" y="420" width="180" height="100" rx="8" fill="rgba(0,212,255,0.1)" stroke="#00D4FF" stroke-width="2"/>
    <text x="870" y="455" font-size="11" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Version Control</text>
    <text x="870" y="475" font-size="11" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Git • GitHub • GitLab</text>
    <text x="870" y="500" font-size="9" fill="#b0b0b0" text-anchor="middle">Testing • Documentation</text>
  </g>

  <!-- Footer Badge -->
  <rect x="300" y="710" width="400" height="50" fill="rgba(0,212,255,0.1)" stroke="#00D4FF" stroke-width="2" rx="8"/>
  <text x="500" y="730" font-size="13" text-anchor="middle" fill="#a8dadc" font-family="Arial, sans-serif" font-weight="bold">
    🎯 Complete DevSecOps Stack • Cloud-Native • Enterprise-Ready
  </text>
</svg>