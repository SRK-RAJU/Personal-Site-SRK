<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tasksGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="url(#tasksGrad)"/>
  
  <!-- Dashboard Layout -->
  <g transform="translate(50, 50)">
    <!-- Header -->
    <rect x="0" y="0" width="700" height="50" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="20" y="15" width="200" height="20" rx="4" fill="#fef3c7"/>
    
    <!-- Sidebar -->
    <rect x="0" y="60" width="120" height="250" rx="8" fill="rgba(255,255,255,0.9)" filter="url(#shadow)"/>
    <rect x="10" y="75" width="100" height="8" rx="2" fill="#fed7aa"/>
    <rect x="10" y="95" width="100" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="10" y="110" width="100" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="10" y="125" width="100" height="6" rx="2" fill="#e5e7eb"/>
    
    <!-- Task Cards -->
    <rect x="140" y="60" width="180" height="110" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="155" y="75" width="150" height="8" rx="2" fill="#fcd34d"/>
    <rect x="155" y="95" width="150" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="155" y="108" width="120" height="6" rx="2" fill="#e5e7eb"/>
    
    <rect x="340" y="60" width="180" height="110" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="355" y="75" width="150" height="8" rx="2" fill="#60a5fa"/>
    <rect x="355" y="95" width="150" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="355" y="108" width="130" height="6" rx="2" fill="#e5e7eb"/>
    
    <rect x="540" y="60" width="160" height="110" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="555" y="75" width="130" height="8" rx="2" fill="#34d399"/>
    <rect x="555" y="95" width="130" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="555" y="108" width="100" height="6" rx="2" fill="#e5e7eb"/>
    
    <!-- Chart Area -->
    <rect x="140" y="190" width="560" height="120" rx="8" fill="rgba(255,255,255,0.85)" filter="url(#shadow)"/>
    <text x="160" y="210" font-size="14" font-weight="bold" fill="#333" font-family="Arial">Performance Chart</text>
    
    <!-- Mini bars -->
    <rect x="180" y="260" width="20" height="30" fill="#fcd34d"/>
    <rect x="220" y="250" width="20" height="40" fill="#fcd34d"/>
    <rect x="260" y="245" width="20" height="45" fill="#fcd34d"/>
    <rect x="300" y="240" width="20" height="50" fill="#60a5fa"/>
    <rect x="340" y="235" width="20" height="55" fill="#60a5fa"/>
    <rect x="380" y="230" width="20" height="60" fill="#34d399"/>
    <rect x="420" y="225" width="20" height="65" fill="#34d399"/>
    <rect x="460" y="220" width="20" height="70" fill="#ec4899"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">Facility Management System</text>
</svg>