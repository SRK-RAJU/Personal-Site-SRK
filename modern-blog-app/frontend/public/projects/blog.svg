<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="url(#blogGrad)"/>
  
  <!-- Blog Post Icon -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="200" height="240" rx="10" fill="white" filter="url(#shadow)"/>
    <rect x="20" y="20" width="160" height="40" rx="4" fill="#e0e7ff"/>
    <rect x="20" y="80" width="160" height="8" rx="2" fill="#d1d5db"/>
    <rect x="20" y="100" width="160" height="8" rx="2" fill="#d1d5db"/>
    <rect x="20" y="120" width="140" height="8" rx="2" fill="#d1d5db"/>
    <rect x="20" y="150" width="160" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="20" y="165" width="160" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="20" y="180" width="140" height="6" rx="2" fill="#e5e7eb"/>
  </g>
  
  <!-- Featured Content -->
  <g transform="translate(350, 80)">
    <circle cx="50" cy="50" r="50" fill="white" filter="url(#shadow)"/>
    <text x="50" y="65" font-size="60" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="Arial">📝</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="180" height="240" rx="10" fill="rgba(255,255,255,0.95)" filter="url(#shadow)"/>
    <text x="90" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="Arial">1M+</text>
    <text x="90" y="80" font-size="16" text-anchor="middle" fill="#666" font-family="Arial">Visitors</text>
    
    <rect x="20" y="110" width="140" height="2" fill="#e0e7ff"/>
    
    <text x="90" y="150" font-size="28" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="Arial">500+</text>
    <text x="90" y="175" font-size="14" text-anchor="middle" fill="#666" font-family="Arial">Articles</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">Blog Platform</text>
</svg>