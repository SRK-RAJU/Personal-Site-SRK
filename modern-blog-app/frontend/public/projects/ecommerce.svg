<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="url(#storeGrad)"/>
  
  <!-- Shopping Cart Icon -->
  <g transform="translate(80, 60)">
    <path d="M 20 10 L 80 10 L 70 80 Q 65 85 60 85 L 30 85 Q 25 85 20 80 Z" stroke="white" stroke-width="3" fill="none"/>
    <circle cx="35" cy="100" r="8" fill="white"/>
    <circle cx="65" cy="100" r="8" fill="white"/>
  </g>
  
  <!-- Products -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="white" filter="url(#shadow)"/>
    <rect x="5" y="5" width="70" height="50" rx="3" fill="#dcfce7"/>
    <text x="40" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#333" font-family="Arial">Product</text>
    <text x="40" y="90" font-size="12" text-anchor="middle" fill="#666" font-family="Arial">₹999</text>
  </g>
  
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="white" filter="url(#shadow)"/>
    <rect x="5" y="5" width="70" height="50" rx="3" fill="#dcfce7"/>
    <text x="40" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#333" font-family="Arial">Product</text>
    <text x="40" y="90" font-size="12" text-anchor="middle" fill="#666" font-family="Arial">₹1299</text>
  </g>
  
  <g transform="translate(470, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="white" filter="url(#shadow)"/>
    <rect x="5" y="5" width="70" height="50" rx="3" fill="#dcfce7"/>
    <text x="40" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#333" font-family="Arial">Product</text>
    <text x="40" y="90" font-size="12" text-anchor="middle" fill="#666" font-family="Arial">₹799</text>
  </g>
  
  <!-- Payment Button -->
  <g transform="translate(580, 120)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
    <text x="70" y="42" font-size="18" font-weight="bold" text-anchor="middle" fill="#10b981" font-family="Arial">Checkout</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(80, 270)">
    <text x="0" y="30" font-size="32" font-weight="bold" fill="white" font-family="Arial">500+</text>
    <text x="0" y="55" font-size="14" fill="rgba(255,255,255,0.8)" font-family="Arial">Products</text>
  </g>
  
  <g transform="translate(280, 270)">
    <text x="0" y="30" font-size="32" font-weight="bold" fill="white" font-family="Arial">10K+</text>
    <text x="0" y="55" font-size="14" fill="rgba(255,255,255,0.8)" font-family="Arial">Transactions</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">E-commerce Store</text>
</svg>