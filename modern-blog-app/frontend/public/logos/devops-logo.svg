<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="devopsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="url(#devopsGradient)" stroke-width="3"/>
  
  <!-- Gear Icons -->
  <g transform="translate(70, 60)">
    <!-- Left Gear -->
    <circle cx="15" cy="20" r="18" fill="none" stroke="url(#devopsGradient)" stroke-width="2"/>
    <circle cx="15" cy="20" r="5" fill="url(#devopsGradient)"/>
    <!-- Teeth -->
    <rect x="13" y="3" width="4" height="6" fill="url(#devopsGradient)"/>
    <rect x="13" y="31" width="4" height="6" fill="url(#devopsGradient)"/>
    
    <!-- Right Gear -->
    <circle cx="50" cy="20" r="18" fill="none" stroke="url(#devopsGradient)" stroke-width="2"/>
    <circle cx="50" cy="20" r="5" fill="url(#devopsGradient)"/>
    <!-- Teeth -->
    <rect x="48" y="3" width="4" height="6" fill="url(#devopsGradient)"/>
    <rect x="48" y="31" width="4" height="6" fill="url(#devopsGradient)"/>
  </g>
  
  <!-- Arrow showing flow -->
  <g transform="translate(100, 120)">
    <path d="M -20 0 L 20 0 M 15 -5 L 20 0 L 15 5" stroke="url(#devopsGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#FF8C42" font-family="Arial, sans-serif">DevOps</text>
</svg>