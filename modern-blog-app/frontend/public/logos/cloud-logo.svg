<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="url(#cloudGradient)" stroke-width="3"/>
  
  <!-- Cloud Shape -->
  <g transform="translate(50, 50)">
    <path d="M 40 60 Q 20 60 15 45 Q 10 30 25 20 Q 40 15 50 20 Q 60 10 75 15 Q 85 20 85 35 L 85 60 Z" fill="url(#cloudGradient)" stroke="#4A90E2" stroke-width="2"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#87CEEB" font-family="Arial, sans-serif">Cloud</text>
</svg>