<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle Background -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="url(#srkGradient)" stroke-width="3"/>
  
  <!-- SRK Text -->
  <text x="100" y="85" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#srkGradient)" font-family="Arial, sans-serif" letter-spacing="2">SRK</text>
  
  <!-- Subtitle -->
  <text x="100" y="130" font-size="10" text-anchor="middle" fill="#a8dadc" font-family="Arial, sans-serif" letter-spacing="1">DevSecOps</text>
  
  <!-- Corner accent -->
  <circle cx="165" cy="165" r="15" fill="#ff006e" opacity="0.8"/>
</svg>