<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="securityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="url(#securityGradient)" stroke-width="3"/>
  
  <!-- Shield -->
  <g transform="translate(80, 50)">
    <path d="M 40 10 L 60 20 L 60 50 Q 40 65 40 65 Q 20 50 20 20 Z" fill="none" stroke="url(#securityGradient)" stroke-width="3"/>
    <!-- Checkmark -->
    <path d="M 30 50 L 38 60 L 52 35" stroke="url(#securityGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Lock Icon -->
  <g transform="translate(60, 110)">
    <!-- Lock body -->
    <rect x="10" y="20" width="30" height="25" rx="3" fill="none" stroke="url(#securityGradient)" stroke-width="2"/>
    <!-- Lock shackle -->
    <path d="M 15 20 Q 15 5 25 5 Q 35 5 35 20" fill="none" stroke="url(#securityGradient)" stroke-width="2"/>
    <!-- Key hole -->
    <circle cx="25" cy="32" r="2.5" fill="url(#securityGradient)"/>
  </g>
  
  <!-- Label -->
  <text x="100" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff006e" font-family="Arial, sans-serif">Security</text>
</svg>